<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Business Cards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="text-left mt-4">
      <a href="{{ url_for('start_page') }}" class="btn btn-outline-secondary">⬅ Start Page</a>
    </div>
    <h1 class="mb-4 text-center">🔍 Search Business Cards</h1>

    <!-- Search input -->
    <div class="d-flex mb-4">
      <input type="text" id="searchBox" class="form-control me-2" placeholder="Enter keyword (e.g. Manager)">
      <button class="btn btn-success" onclick="loadCards()">Search</button>
    </div>

    <!-- Results go here -->
    <div id="results" class="row"></div>


  </div>

  <script>
    async function loadCards() {
      const query = document.getElementById("searchBox").value;
      const res = await fetch(`/api/search_cards?q=${encodeURIComponent(query)}`);
      const data = await res.json();

      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (data.length === 0) {
        resultsDiv.innerHTML = "<p class='text-muted text-center'>No cards found</p>";
        return;
      }

      data.forEach(row => {
        const card = `
          <div class="col-md-4 mb-3">
            <div class="card shadow">
              <img src="/${row.image_path}" class="card-img-top" alt="${row.side} image">
              <div class="card-body">
                <p class="card-text small">${row.raw_text.substring(0, 120)}...</p>
                <a href="/card/${row.card_id}" class="btn btn-outline-primary btn-sm">View Details</a>
              </div>
            </div>
          </div>`;
        resultsDiv.innerHTML += card;
      });
    }

    // Load all cards on page load
    window.onload = loadCards;

    // Live search (every keystroke)
    document.getElementById("searchBox").addEventListener("input", loadCards);
  </script>
</body>
</html>
