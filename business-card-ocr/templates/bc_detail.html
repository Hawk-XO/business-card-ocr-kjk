<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card {{ card_id }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    pre {
      white-space: pre-wrap;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #dee2e6;
    }
    .card-img-top {
      max-height: 250px;
      object-fit: contain;
      border-bottom: 1px solid #dee2e6;
    }
  </style>
</head>
<body class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Business Card: <span class="text-primary">{{ card_id }}</span></h2>
    <div>
      <a href="/" class="btn btn-primary btn-sm">⬅ Start Page</a>
      <a href="/search" class="btn btn-outline-secondary btn-sm">← Back to Search</a>
    </div>
  </div>

  <!-- Delete button -->
  <div class="mb-4">
    <button class="btn btn-danger" onclick="confirmDelete('{{ card_id }}')">
      🗑 Delete This Card
    </button>
  </div>

  <div class="row">
    {% for row in rows %}
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm h-100">
          <div class="card-header text-capitalize fw-bold">
            {{ row.side }} Side
          </div>
          <img src="/{{ row.image_path }}" class="card-img-top" alt="{{ row.side }} image">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">Extracted Text</h6>
            <pre>{{ row.raw_text }}</pre>
          </div>
          <div class="card-footer text-muted small">
            Uploaded: {{ row.created_at }}
          </div>
        </div>
      </div>
    {% endfor %}
  </div>

  <script>
    function confirmDelete(cardId) {
      if (confirm("Are you sure you want to delete this card? This action cannot be undone.")) {
        fetch(`/card/${cardId}/delete`, { method: "POST" })
          .then(res => {
            if (res.ok) {
              alert("Card deleted successfully!");
              window.location.href = "/search"; // Redirect after delete
            } else {
              alert("Error deleting card.");
            }
          })
          .catch(err => alert("Error: " + err));
      }
    }
  </script>

</body>
</html>
